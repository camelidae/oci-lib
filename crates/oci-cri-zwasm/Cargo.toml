[package]
name = "oci-cri-zwasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Preview1 WASI guest runner used by oci-cri"
publish = false

[features]
default = []
# Links zwasm-sdk into this binary only. Needs Zig 0.16 on PATH at build time.
zwasm = ["dep:zwasm-sdk"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
zwasm-sdk = { version = "0.4", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "oci-cri-zwasm"
path = "src/main.rs"
required-features = ["zwasm"]
