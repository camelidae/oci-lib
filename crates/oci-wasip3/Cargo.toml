[package]
name = "oci-wasip3"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.97"
publish = false
description = "Standalone WASI 0.3 command runner for isolated OCI containers"

[dependencies]
anyhow = "1"
wasmtime = { version = "=50.0.1", default-features = false, features = ["anyhow", "std", "runtime", "cranelift", "component-model-async"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p3"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
